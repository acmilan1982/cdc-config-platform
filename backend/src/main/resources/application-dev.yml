# 开发环境配置
spring:
  datasource:
    url: jdbc:oracle:thin:@//192.168.174.65:1521/prod.enmotech.com
    username: CDC
    password: CDC
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000

cdc:
  monitor:
    scn-stale-threshold-hours: ${CDC_MONITOR_SCN_STALE_THRESHOLD_HOURS:24}
  zookeeper:
    connect-string: ${CDC_ZK_CONNECT:10.19.16.111:2181}
    root-path: ${CDC_ZK_ROOT:/bsoft-cdc}
    session-timeout-ms: 30000
    connection-timeout-ms: 15000
  log-query:
    cursor-secret: ${CDC_LOG_QUERY_CURSOR_SECRET:}
    enabled: ${CDC_LOG_QUERY_ENABLED:false}

logging:
  level:
    root: INFO
    com.bsoft.cdcconfig: DEBUG
    com.bsoft.cdcconfig.**.mapper: DEBUG
